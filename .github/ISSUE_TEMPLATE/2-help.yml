name: 使用求助
description: 不知道怎么用、看不懂报告里的结论
title: "[求助] "
labels: ["求助"]
body:
  - type: markdown
    attributes:
      value: |
        提问前请先看：程序左栏最下面的「帮助」页、每个功能旁边的「?」、包里的「上手视频.mp4」和「使用说明.html」。
        大部分「怎么用」的问题那里都有答案，比在这里等回复快。

  - type: input
    id: version
    attributes:
      label: 程序版本
      placeholder: "0.10.2"
    validations:
      required: true

  - type: textarea
    id: question
    attributes:
      label: 想做什么 / 哪里看不懂
      description: 看不懂报告里的某条结论，就把那一条复制过来
    validations:
      required: true

  - type: textarea
    id: tried
    attributes:
      label: 已经试过什么
      placeholder: 看了帮助页的「……」，还是不明白……
